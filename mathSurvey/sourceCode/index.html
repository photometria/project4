<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Survey Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Math Survey</h1>
    <h2>Login</h2>
    <form id="login_form">
        <p>
            <label>Username<br>
                <input id="username" type="text">
            </label>
        </p>
        <p>
            <label>Password<br>
                <input id="password" type="password">
            </label>
        </p>
        <p>
            <label><input id="remember" type="checkbox"> Remember username</label>
        </p>
        <button>Login</button>
    </form>
    <form action="newAccount.html">
        <p><button>Create account</button></p>
    </form>
    <script src="login.js"></script>
</body>
</html>
